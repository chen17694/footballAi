    <script>
        function secureShuffle(arr) {
        const a = arr.slice();
        const rand = new Uint32Array(1);
        for (let i = a.length - 1; i > 0; i--) {
            // 拒绝采样消除取模偏差
            const max = Math.floor(0xFFFFFFFF / (i + 1)) * (i + 1);
            let x;
            do {
            crypto.getRandomValues(rand);
            x = rand[0];
            } while (x >= max);
            const j = x % (i + 1);
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
        }
        const arr = secureShuffle( [...Array(300).fill(1), ...Array(300).fill(0)])
        const i = Math.floor(Math.random() * arr.length);
  const val = arr.splice(i, 1)[0];
  console.log(`抽到: ${val}, 剩余: ${arr.length}`);
    </script>
