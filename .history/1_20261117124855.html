    <script>
        function secureShuffle(arr) {
  const a = arr.slice();
  const rand = new Uint32Array(1);
  for (let i = a.length - 1; i > 0; i--) {
    // 拒绝采样消除取模偏差
    const max = Math.floor(0xFFFFFFFF / (i + 1)) * (i + 1);
    let x;
    do {
      crypto.getRandomValues(rand);
      x = rand[0];
    } while (x >= max);
    const j = x % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
